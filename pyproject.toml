[project]
name = "tinyprobe"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "rust-just>=1.57.0",
    "tipy",
]

[tool.uv.sources]
tipy = { path = "software", editable = true }
embgen = { git = "https://github.com/CedricHirschi/embgen.git" }

[dependency-groups]
dev = [
    "embgen",
    "nanopb>=0.4.9.1",
    "prek>=0.5.3",
    "protoc-runner>=36.0",
    "ruff>=0.16.0",
]
doc = [
    "mkdocs>=1.6.1",
    "mkdocs-github-admonitions-plugin>=0.1.1",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-material[imaging]>=9.7.1",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings[python]>=1.0.1",
    "mkdoxy>=1.2.8",
    "ruff>=0.14.14",
]
