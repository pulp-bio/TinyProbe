[project]
name = "tipy"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.12.1",
    "jax>=0.8.2",
    "json-with-comments>=1.2.10",
    "numpy>=2.3.5",
    "protobuf>=7.36.0",
    "pydantic>=2.12.5",
    "rich>=14.2.0",
    "zeroconf>=0.148.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.14.9",
    "ty>=0.0.1a34",
]
demo = [
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = [
    "--tb=short",       # Shorter traceback format
    "--strict-markers", # Require markers to be defined
]
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
exclude = [
    "**/*.ipynb",
    "scratch.py",
    "**/methods_pb2.py",
    "**/methods_pb2.pyi",
    "**/regmap_base.py",
    "**/regmap*.py",
]
[tool.ruff.lint]
ignore = [
    "LOG015", # Allow use of root logger
    "SIM115", # Allow use of `open` without context manager
    "BLE001", # Allow use of blind except clauses
]

[tool.ty.src]
exclude = [
    "**/methods_pb2.py",
    "**/methods_pb2.pyi",
    "**/regmap_base.py",
    "**/regmap*.py",
]
